<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Primary SEO -->
    <title>
      FromZeroHQ | Creator Marketing Infrastructure for Modern Brands
    </title>

    <meta
      name="description"
      content="FromZeroHQ helps brands discover verified creators, launch high-performing influencer campaigns, and measure results with transparent reporting."
    />

    <meta
      name="keywords"
      content="creator marketing, influencer marketing, creator platform, campaign management, influencer campaigns, creator discovery, creator infrastructure"
    />

    <meta
      name="author"
      content="FromZeroHQ"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#030712"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://fromzerohq.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="FromZeroHQ | Creator Marketing Infrastructure"
    />

    <meta
      property="og:description"
      content="Discover creators, launch campaigns, and measure performance from one powerful platform."
    />

    <meta
      property="og:url"
      content="https://fromzerohq.com/"
    />

    <meta
      property="og:image"
      content="https://fromzerohq.com/og-image.jpg"
    />

    <meta
      property="og:site_name"
      content="FromZeroHQ"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="FromZeroHQ | Creator Marketing Infrastructure"
    />

    <meta
      name="twitter:description"
      content="Scale creator marketing with verified creators, transparent reporting, and measurable campaign performance."
    />

    <meta
      name="twitter:image"
      content="https://fromzerohq.com/og-image.jpg"
    />

    <!-- Performance -->
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <!-- Manifest -->
    <link
      rel="manifest"
      href="/site.webmanifest"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
